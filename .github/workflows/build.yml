name: Build

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    
    - name: Build CLI
      run: |
        cd Core/mc-launcher-cli
        go mod init mc-launcher-cli 2>/dev/null || true
        go mod edit -replace github.com/NekoMymaomao/mc-launcher/core=../mc-launcher-lib
        go mod tidy
        CGO_ENABLED=0 go build -ldflags="-s -w" -o mc-launcher-linux-amd64 .
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o mc-launcher-linux-arm64 .
        CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o mc-launcher-windows-amd64.exe .
    
    - name: Build Backend
      run: |
        cd backend
        go mod tidy
        CGO_ENABLED=0 go build -ldflags="-s -w" -o mc-launcher-server .
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mc-launcher-dist
        path: |
          Core/mc-launcher-cli/mc-launcher-*
          backend/mc-launcher-server
        retention-days: 30
